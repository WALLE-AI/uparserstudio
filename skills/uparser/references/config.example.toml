# uparser endpoint config — copy to ~/.config/uparser/config.toml
# (Windows: same path under your home, i.e. %USERPROFILE%\.config\uparser\config.toml)
#
# Read directly by the `uparser` binary (parse/doctor) as the lowest-precedence
# fallback for --endpoint/--model: explicit flag > $UPARSER_ENDPOINT /
# $UPARSER_MODEL env > this file's [<protocol>] section. The section is matched
# against the *effective* protocol, so `--protocol auto` that routes to
# mineru-vlm reads [mineru-vlm]. Override the path with $UPARSER_CONFIG.
# (The scripts/uparser-run.* wrappers read the same file; now redundant.)

[mineru-vlm]
endpoint = "http://127.0.0.1:19122/v1/chat/completions"
model    = "MinerU2.5-2604-1.2B"

# [dots-ocr]
# endpoint = "http://127.0.0.1:8000/v1/chat/completions"
# model    = "dots-ocr"

# [monkeyocr-v2]
# endpoint = "http://127.0.0.1:8000/v1/chat/completions"
# model    = "MonkeyOCR-v2"

# native needs no endpoint/model — nothing to configure here.
