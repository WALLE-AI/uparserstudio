# uparser configuration — copy to ~/.config/uparser/config.toml
# (Windows: same path under your home, i.e. %USERPROFILE%\.config\uparser\config.toml)
# Override the path with $UPARSER_CONFIG.
#
# Read directly by the `uparser` binary — by `parse` and `doctor`, and by the
# Node/Python bindings, which share the same resolution chain.
#
# Resolution order, applied PER KEY (not per section):
#
#   1. the explicit CLI flag            --endpoint / --model / --<stage>-endpoint
#   2. environment                      UPARSER_ENDPOINT / UPARSER_MODEL / UPARSER_API_KEY
#   3. this file's [<protocol>] section
#   4. this file's [defaults] section
#   5. the protocol's built-in default  (declared in protocol_spec.rs)
#
# Sections are matched against the *effective* protocol, i.e. after
# `--mode auto` has routed to a concrete adapter — so a routed mineru-vlm
# reads [mineru-vlm], never [auto].
#
# Everything is optional. An absent file is not an error.
# Values must be valid TOML: quote your strings. (A file that fails to parse
# falls back to a legacy flat reader that tolerated unquoted values, and warns
# on stderr — don't rely on it in new configs.)


# ---------------------------------------------------------------------------
# [defaults] — inherited by every protocol that doesn't override the key
# ---------------------------------------------------------------------------
# [defaults]
# endpoint     = "http://127.0.0.1:8000/v1/chat/completions"
# model        = "your-model"
# timeout_secs = 120     # per request; default varies per protocol (60-180)
# max_retries  = 2       # retries after the first attempt
#
# Authentication. Sent as `Authorization: Bearer <key>` on every request.
# Needed for hosted/gateway endpoints; local vLLM usually needs neither.
# api_key     = "sk-..."          # literal
# api_key_env = "MY_TOKEN_VAR"    # OR read it from this env var (preferred —
#                                 # keeps the secret out of the file)
#
# Extra headers, sent on every request.
# [defaults.headers]
# X-Tenant = "acme"


# ---------------------------------------------------------------------------
# VLM protocols — OpenAI-compatible chat-completions endpoints (vLLM/LMDeploy)
# ---------------------------------------------------------------------------

[mineru-vlm]
endpoint = "http://10.147.45.228:60002/files/parser/v1/chat/completions"
model    = "MinerU2.5-Pro-2605-1.2B"
# api_key_env = "MINERU_TOKEN"
# timeout_secs = 60          # this protocol's built-in default
# [mineru-vlm.headers]
# X-Tenant = "acme"

# [dots-ocr]
# endpoint = "http://127.0.0.1:8000/v1/chat/completions"
