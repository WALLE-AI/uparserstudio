# retry_repeat_max_retries = 3

# [navidc-ocr]
# NOTE: stock vLLM cannot load this checkpoint (its config says qwen2_5_vl
# but the text tower is Qwen3-shaped). Install the upstream plugin first:
#   pip install -e opensource/NaviDC-OCR/NaviOCR-vllm   (pins vllm==0.11.0)
# Keep --max-model-len >= 8192.
# endpoint    = "http://127.0.0.1:8010/v1/chat/completions"
# model       = "StarDoc-AI/NaviDC-OCR"
# layout_mode = "detection"       # detection | segmentation

# [generic-vlm]
# Any chat-completions VLM told to emit Markdown. Use for a model uparser
# has no dedicated adapter for.
# endpoint = "http://127.0.0.1:8000/v1/chat/completions"
# model    = "qwen2.5-vl-7b"


# ---------------------------------------------------------------------------
# OCR / structure services — their own REST contracts, not chat-completions.
# These have no model parameter; a configured `model` is reported as ignored.
# ---------------------------------------------------------------------------

# [paddleocr]
# endpoint = "http://127.0.0.1:8868/predict/ocr_system"

# [paddlex-structure]
# PP-StructureV3's /layout-parsing service.
# endpoint = "http://127.0.0.1:8080/layout-parsing"


# ---------------------------------------------------------------------------
# [pipeline] — the multi-stage protocol
# ---------------------------------------------------------------------------
# `endpoint` is a BASE url; all stage URLs are derived from it as
# <base>/v2/pipeline/{layout,mfd,ocr,mfr,table}:batch. Setting it alone is
# enough for a single-host deployment.
#
# [pipeline]
# endpoint     = "http://127.0.0.1:9001"
# language     = "ch"
# timeout_secs = 180
#
# Override individual stages only when they live on different hosts (e.g. one
# GPU box per stage). Anything left unset keeps its derived value.
# [pipeline.stages]
# layout            = "http://gpu-a:9101/v2/pipeline/layout:batch"
# formula_detection = "http://gpu-a:9102/v2/pipeline/mfd:batch"
# ocr               = "http://gpu-b:9103/v2/pipeline/ocr:batch"
# formula           = "http://gpu-b:9104/v2/pipeline/mfr:batch"
# table             = "http://gpu-c:9105/v2/pipeline/table:batch"
#
# "Bare" tensor endpoints: Rust owns preprocessing/decoding and the service
# serves raw model tensors. bare_formula requires formula_tokenizer, and
# bare_ocr_base requires ocr_dictionary — each pair must be set together.
# bare_layout       = "http://gpu-a:9201/layout"
# bare_ocr_base     = "http://gpu-b:9202"
# bare_formula      = "http://gpu-b:9203/formula"
# bare_table_base   = "http://gpu-c:9204"
#
# [pipeline.paths]
# ocr_dictionary    = "/models/ppocr_keys_v1.txt"
# formula_tokenizer = "/models/mfr/tokenizer.json"


# ---------------------------------------------------------------------------
# Protocols with nothing to configure
# ---------------------------------------------------------------------------
# native     — zero-model, pure-Rust PDF text layer. No endpoint, no model.
# tesseract  — local OCR subprocess. Language comes from $UPARSER_OCR_LANG
#              (default "eng"), not from this file.
# mock       — explicit-only placeholder output. Never select it for real work.
