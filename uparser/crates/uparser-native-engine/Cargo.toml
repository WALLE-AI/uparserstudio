[package]
name = "uparser-native-engine"
version = "0.1.7"
edition = "2021"
license = "MIT"
description = "Vendored pure-Rust PDF text-extraction engine for uparser's `native` protocol. Internalized from firecrawl/pdf-inspector (MIT). See ATTRIBUTION.md."
autobins = false

[lib]
name = "uparser_native_engine"
crate-type = ["lib"]

[dependencies]
# Error handling
thiserror = "2.0"
# Logging
log = "0.4"
# Text processing
regex = "1.10"
once_cell = "1.19"
unicode-normalization = "0.1"
# TrueType font parsing (Identity-H CID font cmap extraction)
ttf-parser = "0.25"

# Native builds keep lopdf's parallel parser. (Browser WASM path preserved
# from upstream for future use but not built by uparser today.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.42.0", features = ["rayon"] }
rayon = "1.10"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }
include_dir = "0.7"

[dev-dependencies]
tempfile = "3.3"
