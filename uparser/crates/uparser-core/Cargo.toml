[package]
name = "uparser-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Core parsing engine and CLI for uparser"

[lib]
name = "uparser_core"

[[bin]]
name = "uparser"
path = "src/main.rs"

[features]
# Not default-on: `liteparse-pdfium-sys`'s build script downloads a
# prebuilt PDFium binary from GitHub on first build, which isn't reliable
# in every environment. Opt in with `--features pdfium` when network
# access to GitHub releases (or a pre-populated `~/.cache/pdfium-rs`) is
# available.
default = []
pdfium = ["dep:pdfium"]
# Zero-model native-PDF-text-layer protocol: embeds liteparse as a
# library. Pulls in `pdfium` transitively (liteparse needs it). Not
# default-on for the same reason as `pdfium` above.
native = ["dep:liteparse", "pdfium"]
# Local ONNX inference for the `pipeline` protocol's `table` stage
# (ARCHITECTURE.md §11.2). Not default-on: `ort`'s `download-binaries`
# feature fetches a prebuilt ONNX Runtime binary on first build, same
# network-availability caveat as `pdfium` above. Confirmed in this repo's
# dev sandbox (Ubuntu 22.04 / glibc 2.35): the crate itself compiles
# (`cargo build --lib --features pipeline-local-table` succeeds) but
# linking a binary/test target fails — the prebuilt static ONNX Runtime
# archive references glibc >=2.38 symbols. See `adapters/onnx_table.rs`'s
# module doc for the full investigation; expected to work unmodified on
# glibc >=2.38.
pipeline-local-table = ["dep:ort"]

[dependencies]
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["default-formats"] }
regex = "1"
futures = "0.3"
pdfium = { package = "liteparse-pdfium", version = "1.3.0", path = "../../../opensource/liteparse/crates/pdfium", optional = true }
liteparse = { path = "../../../opensource/liteparse/crates/liteparse", default-features = false, optional = true }
file-format = { version = "0.29.0", features = ["reader"] }
calamine = "0.26"
csv = "1"
tempfile = "3"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["download-binaries", "tls-rustls", "std", "api-24"], optional = true }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
wiremock = "0.6"
proptest = "1"
assert_cmd = "2"
predicates = "3"
