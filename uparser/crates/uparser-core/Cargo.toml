[package]
name = "uparser-core"
version = "0.4.0-rc.1"
edition.workspace = true
license.workspace = true
description = "Core parsing engine and CLI for uparser"

[lib]
name = "uparser_core"

[[bin]]
name = "uparser"
path = "src/main.rs"

[features]
# Not default-on: `liteparse-pdfium-sys`'s build script downloads a
# prebuilt PDFium binary from GitHub on first build, which isn't reliable
# in every environment. Opt in with `--features pdfium` when network
# access to GitHub releases (or a pre-populated `~/.cache/pdfium-rs`) is
# available.
default = []
pdfium = ["dep:pdfium"]
# Zero-model native-PDF-text-layer protocol: embeds the vendored
# `uparser-native-engine` (pure-Rust, lopdf-based, internalized from
# firecrawl/pdf-inspector — see NATIVE_ENGINE_INTERNALIZATION_DESIGN.md).
# Unlike the old liteparse-based native, this pulls **no** PDFium binary,
# so `--features native` builds fully offline. Not default-on only to keep
# the default build minimal.
native = ["dep:uparser-native-engine"]
# Test/diagnostic surface: re-exports the transport, tensor-wire and
# pipeline decoder modules that `examples/*` smoke runners drive directly.
# Not for library consumers — the supported API is `api`/`runner`/`types`.
internals = []

[dependencies]
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["default-formats"] }
regex = "1"
futures = "0.3"
pdfium = { package = "liteparse-pdfium", version = "=1.3.0", optional = true }
uparser-native-engine = { path = "../uparser-native-engine", optional = true }
uparser-document-engine = { path = "../uparser-document-engine" }
file-format = { version = "0.29.0", features = ["reader"] }
calamine = "0.26"
csv = "1"
tempfile = "3"

[[example]]
name = "bare_formula_smoke"
path = "examples/bare_formula_smoke.rs"
required-features = ["internals"]

[[example]]
name = "bare_model_smoke"
path = "examples/bare_model_smoke.rs"
required-features = ["internals"]

[[example]]
name = "bare_ocr_smoke"
path = "examples/bare_ocr_smoke.rs"
required-features = ["internals"]

[[example]]
name = "bare_unet_smoke"
path = "examples/bare_unet_smoke.rs"
required-features = ["internals"]

[[example]]
name = "dots_ocr_smoke"
path = "examples/dots_ocr_smoke.rs"
required-features = ["internals"]

[[example]]
name = "mineru_vlm_smoke"
path = "examples/mineru_vlm_smoke.rs"
required-features = ["internals"]

[[example]]
name = "monkeyocrv2_smoke"
path = "examples/monkeyocrv2_smoke.rs"
required-features = ["internals"]

[dev-dependencies]
insta = { version = "1", features = ["json"] }
wiremock = "0.6"
proptest = "1"
assert_cmd = "2"
predicates = "3"
zip = "2"
