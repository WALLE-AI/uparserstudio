[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uparser-pipeline-server"
version = "0.1.0"
description = "MinerU-current compatible model service for uparser pipeline V2"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "packaging>=24,<26",
  "pillow>=10,<12",
  "pydantic>=2.10,<3",
  "transformers>=4.57.3,<5",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
legacy = ["magic-pdf==1.3.5"]

[project.scripts]
uparser-pipeline-server = "uparser_pipeline_server.app:main"
uparser-bare-model-server = "uparser_pipeline_server.bare_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uparser_pipeline_server"]
